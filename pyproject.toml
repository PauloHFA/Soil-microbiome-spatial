[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soil-microbiome-spatial-pipeline"
version = "0.1.0"
description = "Computational pipeline assessing discriminatory potential of bacterial (16S) and fungal (ITS) soil profiles under spatial cross-validation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Soil Microbiome Spatial Research"}
]
keywords = [
    "microbiome",
    "16S",
    "ITS",
    "spatial-cross-validation",
    "soil-ecology",
    "machine-learning"
]
dependencies = [
    "numpy>=1.26.4,<2.3.0",
    "pandas>=2.2.1,<3.0.0",
    "scipy>=1.13.0,<2.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "joblib>=1.4.0,<2.0.0",
    "biopython>=1.83,<2.0.0",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
